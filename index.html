<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <!-- =========================================================
         安全閥測試
         =========================================================
         用途：
         依據銘牌設定壓力（Ps）與初噴壓力（Pi），
         計算安全閥測試相關壓力範圍。
         ========================================================= -->


    <!-- =========================================================
         1. 基本網頁設定
         ========================================================= -->

    <meta charset="UTF-8">

    <!--
        width=device-width：
        網頁寬度配合手機螢幕。

        initial-scale=1.0：
        初始縮放比例 100%。

        maximum-scale=1.0：
        限制最大縮放比例。

        user-scalable=no：
        避免現場操作時誤觸造成頁面縮放。
    -->
    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >


    <!-- 瀏覽器分頁名稱 -->
    <title>安全閥測試</title>


    <!-- =========================================================
         2. iPhone / iPad 主畫面 App 設定
         ========================================================= -->

    <!--
        iPhone「加入主畫面」時使用的圖示。

        icon-180.png 必須與 index.html
        放在 GitHub Repository 的同一層。
    -->
    <link
        rel="apple-touch-icon"
        href="icon-180.png"
    >


    <!--
        從 iPhone 主畫面啟動時，
        允許以 Web App 模式顯示。
    -->
    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >


    <!-- iPhone 狀態列樣式 -->
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >


    <!-- iPhone 主畫面顯示的 App 名稱 -->
    <meta
        name="apple-mobile-web-app-title"
        content="安全閥測試"
    >


    <!-- 瀏覽器 / App 主題色 -->
    <meta
        name="theme-color"
        content="#f2f2f7"
    >



    <style>

        /* =========================================================
           3. 全域顏色設定
           =========================================================
           將常用顏色集中在這裡。

           未來如果要修改整體配色，
           只需要修改這一區即可。
           ========================================================= */

        :root {

            /* App 背景 */
            --background-color: #f2f2f7;

            /* 卡片背景 */
            --card-color: #ffffff;

            /* iOS 風格藍色 */
            --primary-blue: #007aff;

            /* 計算結果紅色 */
            --result-red: #ff3b30;

            /* 輸入框邊線 */
            --border-color: #d1d1d6;

            /* 結果分隔線 */
            --separator-color: #eeeeee;

            /* 回座壓力醒目底色 */
            --highlight-color: #fff9c4;

            /* 回座壓力上方黃線 */
            --highlight-border: #ffcc00;

            /* 主要文字 */
            --text-primary: #1c1c1e;

            /* 次要文字 */
            --text-secondary: #636366;

        }



        /* =========================================================
           4. 固定整個 App 畫面
           =========================================================
           目的：
           防止使用者在 App 畫面上上下滑動，
           讓操作方式比較接近原生 App。
           ========================================================= */

        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;

            /*
                禁止頁面產生捲軸。
            */
            overflow: hidden;

            /*
                減少手機瀏覽器上下拉動時
                產生的 overscroll / 回彈效果。
            */
            overscroll-behavior: none;

        }



        body {

            /*
                優先使用 Apple 系統字體。
                中文則使用蘋方 / 微軟正黑體。
            */
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Text",
                "PingFang TC",
                "Microsoft JhengHei",
                sans-serif;


            background: var(--background-color);

            color: var(--text-primary);


            /*
                將整個 App 固定在 viewport。
            */
            position: fixed;

            inset: 0;


            /*
                配合 iPhone Safe Area。

                避免內容過度靠近：
                - 瀏海
                - 動態島
                - Home Indicator
            */
            padding:
                max(16px, env(safe-area-inset-top))
                16px
                max(16px, env(safe-area-inset-bottom))
                16px;


            /*
                padding 包含在畫面尺寸內，
                避免 padding 把頁面撐高。
            */
            box-sizing: border-box;

        }



        /* =========================================================
           5. App 主容器
           ========================================================= */

        .app-container {

            width: 100%;

            /*
                最大寬度限制在 400px，
                在 iPhone 上閱讀較集中。
            */
            max-width: 400px;

            margin: 0 auto;

        }



        /* =========================================================
           6. App 標題
           ========================================================= */

        .app-title {

            text-align: center;

            font-size: 26px;

            font-weight: 700;

            margin:
                8px
                0
                18px
                0;

        }



        /* =========================================================
           7. 卡片樣式
           ========================================================= */

        .card {

            background:
                var(--card-color);

            padding: 20px;

            border-radius: 15px;

            box-shadow:
                0
                4px
                10px
                rgba(0, 0, 0, 0.08);

            margin-bottom: 16px;

        }



        /* =========================================================
           8. 輸入區
           ========================================================= */

        .input-group {

            margin-bottom: 15px;

        }


        /*
            第二個輸入框與按鈕之間
            保留稍大的間距。
        */
        .input-group:last-of-type {

            margin-bottom: 18px;

        }



        /* 輸入欄位標題 */
        label {

            display: block;

            margin-bottom: 6px;

            font-size: 16px;

            font-weight: 600;

        }



        /*
            Ps / Pi 符號使用稍淡的顏色，
            避免搶過中文名稱的視覺焦點。
        */
        .symbol {

            color:
                var(--text-secondary);

            font-weight: 500;

        }



        /* =========================================================
           9. 數字輸入框
           ========================================================= */

        input {

            width: 100%;

            padding:
                13px
                14px;

            border:
                1px solid
                var(--border-color);

            border-radius: 10px;

            background: #ffffff;

            font-size: 20px;

            font-weight: 500;

            box-sizing: border-box;


            /*
                移除部分 iOS 預設樣式，
                讓畫面呈現較一致。
            */
            -webkit-appearance: none;

            appearance: none;

        }



        /*
            中文輸入提示文字。

            例如：
            「請輸入銘牌設定壓力」
        */
        input::placeholder {

            color: #aeaeb2;

            font-size: 16px;

            font-weight: 400;

        }



        /*
            使用者點擊輸入框時，
            顯示藍色外框，
            清楚提示目前正在輸入哪一欄。
        */
        input:focus {

            outline: none;

            border-color:
                var(--primary-blue);

            box-shadow:
                0
                0
                0
                3px
                rgba(0, 122, 255, 0.15);

        }



        /* =========================================================
           10. 執行計算按鈕
           ========================================================= */

        .calculate-button {

            width: 100%;

            padding: 15px;

            background:
                var(--primary-blue);

            color: #ffffff;

            border: none;

            border-radius: 10px;

            font-size: 18px;

            font-weight: 600;

            cursor: pointer;

            -webkit-appearance: none;

            appearance: none;

        }



        /*
            按下按鈕時稍微縮小，
            提供觸控回饋。
        */
        .calculate-button:active {

            transform: scale(0.98);

            opacity: 0.9;

        }



        /* =========================================================
           11. 計算結果列
           ========================================================= */

        .result-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            min-height: 28px;

            padding:
                10px
                0;

            border-bottom:
                0.5px solid
                var(--separator-color);

        }



        /* 左側項目名稱 */
        .result-label {

            flex: 1;

            font-size: 15px;

            line-height: 1.3;

        }



        /* 右側計算結果 */
        .result-value {

            /*
                防止數字被壓縮。
            */
            flex-shrink: 0;

            font-size: 16px;

            font-weight: 700;

            color:
                var(--result-red);

            text-align: right;


            /*
                使用等寬數字，
                數字排列會比較整齊。
            */
            font-variant-numeric:
                tabular-nums;

        }



        /* =========================================================
           12. 停噴（回座）結果
           =========================================================
           回座壓力是現場重要結果，
           因此使用黃色底色特別標示。
           ========================================================= */

        .reseat-result {

            background:
                var(--highlight-color);

            margin:
                10px
                -20px
                -20px
                -20px;

            padding:
                18px
                20px;

            border-top:
                2px solid
                var(--highlight-border);

            border-radius:
                0
                0
                15px
                15px;

        }



        .reseat-result .result-label {

            font-weight: 700;

        }



        .reseat-result .result-value {

            font-size: 20px;

        }



        /* =========================================================
           13. 較矮螢幕最佳化
           =========================================================
           如果手機可用高度小於 700px，
           自動縮小部分上下間距。

           目的：
           儘可能讓整個安全閥計算器
           維持在單一畫面內。
           ========================================================= */

        @media (max-height: 700px) {

            body {

                padding-top:
                    max(
                        8px,
                        env(safe-area-inset-top)
                    );

            }


            .app-title {

                margin:
                    4px
                    0
                    10px;

                font-size: 23px;

            }


            .card {

                padding: 15px;

                margin-bottom: 10px;

            }


            .input-group {

                margin-bottom: 10px;

            }


            input {

                padding:
                    10px
                    12px;

            }


            .calculate-button {

                padding: 12px;

            }


            .result-row {

                padding:
                    7px
                    0;

            }


            .reseat-result {

                margin:
                    8px
                    -15px
                    -15px;

                padding:
                    14px
                    15px;

            }

        }

    </style>

</head>



<body>


    <!-- =========================================================
         14. App 主畫面
         ========================================================= -->

    <main class="app-container">


        <!-- App 標題 -->
        <h1 class="app-title">
            安全閥測試
        </h1>



        <!-- =====================================================
             15. 壓力輸入區
             ===================================================== -->

        <section class="card">


            <!-- -------------------------------------------------
                 銘牌設定壓力 Ps
                 ------------------------------------------------- -->

            <div class="input-group">

                <label for="ps">

                    銘牌設定壓力

                    <span class="symbol">
                        (Ps)
                    </span>

                </label>


                <!--
                    不設定 value，
                    因此 App 每次重新開啟時為空白。

                    placeholder 使用中文提示。
                -->
                <input
                    type="number"
                    id="ps"
                    inputmode="decimal"
                    step="any"
                    placeholder="請輸入銘牌設定壓力"
                >

            </div>



            <!-- -------------------------------------------------
                 初噴壓力 Pi
                 ------------------------------------------------- -->

            <div class="input-group">

                <label for="pi">

                    初噴壓力

                    <span class="symbol">
                        (Pi)
                    </span>

                </label>


                <!--
                    不設定 value，
                    因此 App 每次重新開啟時為空白。

                    placeholder 使用中文提示。
                -->
                <input
                    type="number"
                    id="pi"
                    inputmode="decimal"
                    step="any"
                    placeholder="請輸入初噴壓力"
                >

            </div>



            <!-- -------------------------------------------------
                 執行計算按鈕
                 ------------------------------------------------- -->

            <button
                type="button"
                class="calculate-button"
                onclick="calculateSafetyValve()"
            >
                執行計算
            </button>


        </section>



        <!-- =====================================================
             16. 計算結果區
             ===================================================== -->

        <section class="card">


            <!-- 1. 初噴允許範圍 -->

            <div class="result-row">

                <span class="result-label">
                    初噴範圍
                    (Ps ±3%)
                </span>

                <span
                    class="result-value"
                    id="initialRange"
                >
                    --
                </span>

            </div>



            <!-- 2. 過壓壓力 -->

            <div class="result-row">

                <span class="result-label">
                    過壓壓力
                    (Ps ×10%)
                </span>

                <span
                    class="result-value"
                    id="overPressure"
                >
                    --
                </span>

            </div>



            <!-- 3. 釋放壓力 -->

            <div class="result-row">

                <span class="result-label">
                    釋放壓力
                    (Pi + 過壓)
                </span>

                <span
                    class="result-value"
                    id="releasePressure"
                >
                    --
                </span>

            </div>



            <!-- 4. 噴出壓力範圍 -->

            <div class="result-row">

                <span class="result-label">
                    噴出壓力範圍
                    (Pi ～ 釋放)
                </span>

                <span
                    class="result-value"
                    id="dischargeRange"
                >
                    --
                </span>

            </div>



            <!-- 5. 噴降壓力範圍 -->

            <div class="result-row">

                <span class="result-label">
                    噴降範圍
                    (Pi ×2%～15%)
                </span>

                <span
                    class="result-value"
                    id="blowdownRange"
                >
                    --
                </span>

            </div>



            <!-- 6. 停噴／回座壓力 -->

            <div class="result-row reseat-result">

                <span class="result-label">
                    停噴（回座）範圍
                </span>

                <span
                    class="result-value"
                    id="reseatRange"
                >
                    --
                </span>

            </div>


        </section>


    </main>



    <script>

        /* =========================================================
           17. 安全閥測試計算程式
           =========================================================

           主要變數定義
           ---------------------------------------------------------

           Ps：
           銘牌設定壓力
           Nameplate Set Pressure

           Pi：
           實際初噴壓力
           Initial Pop Pressure


           ---------------------------------------------------------
           計算項目
           ---------------------------------------------------------

           1. 初噴允許範圍

              下限：
              Ps × 97%

              上限：
              Ps × 103%


           2. 過壓壓力

              Ps × 10%


           3. 釋放壓力

              Pi + 過壓壓力


           4. 噴出壓力範圍

              Pi ～ 釋放壓力


           5. 噴降壓力範圍

              Pi × 2%
                  ～
              Pi × 15%


           6. 停噴（回座）壓力範圍

              最低回座壓力：
              Pi - 最大噴降

              最高回座壓力：
              Pi - 最小噴降


           ---------------------------------------------------------
           小數精度處理原則
           ---------------------------------------------------------

           所有中間計算：
           保留 JavaScript 原始計算精度。

           不在中途使用：
           toFixed(2)

           只有最後顯示到畫面時，
           才統一顯示到小數點後 2 位。

           這樣可以避免中間值先四捨五入，
           造成後續計算結果偏差。
           ========================================================= */



        /**
         * 將壓力數值格式化為小數點後 2 位。
         *
         * 此函式只處理「顯示」，
         * 不會改變前面的實際計算值。
         *
         * 範例：
         *
         * 0.656
         * 顯示為：
         * 0.66
         *
         * 32.144
         * 顯示為：
         * 32.14
         */
        function formatPressure(value) {

            return value.toFixed(2);

        }



        /**
         * 執行安全閥測試計算。
         *
         * 使用者按下：
         * 「執行計算」
         *
         * 就會執行此函式。
         */
        function calculateSafetyValve() {


            /* =====================================================
               STEP 1
               取得 Ps 與 Pi
               ===================================================== */

            const setPressure =
                parseFloat(
                    document
                        .getElementById("ps")
                        .value
                );


            const initialPopPressure =
                parseFloat(
                    document
                        .getElementById("pi")
                        .value
                );



            /* =====================================================
               STEP 2
               檢查使用者是否完成輸入
               =====================================================

               如果 Ps 或 Pi 任一欄沒有有效數字，
               就不執行計算。

               同時跳出中文提示。
               ===================================================== */

            if (
                Number.isNaN(setPressure) ||
                Number.isNaN(initialPopPressure)
            ) {

                alert(
                    "請輸入銘牌設定壓力與初噴壓力"
                );

                return;

            }



            /* =====================================================
               STEP 3
               計算初噴允許範圍
               =====================================================

               下限：
               Ps × 0.97

               上限：
               Ps × 1.03
               ===================================================== */

            const initialPressureMin =
                setPressure * 0.97;


            const initialPressureMax =
                setPressure * 1.03;



            /* =====================================================
               STEP 4
               計算過壓壓力
               =====================================================

               過壓壓力：
               Ps × 10%
               ===================================================== */

            const overPressure =
                setPressure * 0.10;



            /* =====================================================
               STEP 5
               計算釋放壓力
               =====================================================

               釋放壓力：
               Pi + 過壓壓力
               ===================================================== */

            const releasePressure =
                initialPopPressure +
                overPressure;



            /* =====================================================
               STEP 6
               計算噴降壓力範圍
               =====================================================

               最小噴降：
               Pi × 2%

               最大噴降：
               Pi × 15%

               注意：
               此處保留完整計算精度。
               不進行四捨五入。
               ===================================================== */

            const blowdownMin =
                initialPopPressure * 0.02;


            const blowdownMax =
                initialPopPressure * 0.15;



            /* =====================================================
               STEP 7
               計算停噴（回座）壓力範圍
               =====================================================

               最低回座壓力：

               Pi - 最大噴降


               最高回座壓力：

               Pi - 最小噴降


               注意：
               這裡使用的是尚未四捨五入的
               blowdownMin 與 blowdownMax。
               ===================================================== */

            const reseatPressureMin =
                initialPopPressure -
                blowdownMax;


            const reseatPressureMax =
                initialPopPressure -
                blowdownMin;



            /* =====================================================
               STEP 8
               將所有計算結果顯示在畫面
               =====================================================

               從這一步開始，
               才將結果統一顯示至小數點後 2 位。
               ===================================================== */



            /* -----------------------------------------------------
               1. 初噴允許範圍
               ----------------------------------------------------- */

            document
                .getElementById("initialRange")
                .textContent =
                    formatPressure(
                        initialPressureMin
                    )
                    +
                    "～"
                    +
                    formatPressure(
                        initialPressureMax
                    );



            /* -----------------------------------------------------
               2. 過壓壓力
               ----------------------------------------------------- */

            document
                .getElementById("overPressure")
                .textContent =
                    formatPressure(
                        overPressure
                    );



            /* -----------------------------------------------------
               3. 釋放壓力
               ----------------------------------------------------- */

            document
                .getElementById("releasePressure")
                .textContent =
                    formatPressure(
                        releasePressure
                    );



            /* -----------------------------------------------------
               4. 噴出壓力範圍
               ----------------------------------------------------- */

            document
                .getElementById("dischargeRange")
                .textContent =
                    formatPressure(
                        initialPopPressure
                    )
                    +
                    "～"
                    +
                    formatPressure(
                        releasePressure
                    );



            /* -----------------------------------------------------
               5. 噴降壓力範圍
               ----------------------------------------------------- */

            document
                .getElementById("blowdownRange")
                .textContent =
                    formatPressure(
                        blowdownMin
                    )
                    +
                    "～"
                    +
                    formatPressure(
                        blowdownMax
                    );



            /* -----------------------------------------------------
               6. 停噴（回座）壓力範圍
               ----------------------------------------------------- */

            document
                .getElementById("reseatRange")
                .textContent =
                    formatPressure(
                        reseatPressureMin
                    )
                    +
                    "～"
                    +
                    formatPressure(
                        reseatPressureMax
                    );

        }


        /* =========================================================
           注意：

           這裡刻意「不設定」網頁載入時自動計算。

           因此 App 每次重新開啟：

           Ps = 空白
           Pi = 空白

           計算結果 = --

           使用者必須輸入 Ps、Pi，
           再按「執行計算」。
           ========================================================= */


    </script>


</body>

</html>
